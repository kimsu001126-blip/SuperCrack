<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>팀 공지 및 투표 센터</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background: #f5f6f8; padding: 20px 15px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 500px; }
        h1 { font-size: 20px; margin-bottom: 20px; color: #111; }
        .card {
            background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); text-decoration: none; color: inherit; display: block;
        }
        .badge { display: inline-block; padding: 3px 8px; font-size: 11px; font-weight: bold; border-radius: 10px; margin-bottom: 8px; }
        .active { background: #e8f3ff; color: #0066ff; }
        .closed { background: #eee; color: #777; }
        .title { font-size: 16px; font-weight: bold; margin-bottom: 4px; }
        .date { font-size: 12px; color: #888; }
    </style>
</head>
<body>
<div class="container">
    <h1>📢 팀 공지 & 투표 목록</h1>

    <!-- 투표 1 -->
    <a href="notice1.html" class="card">
        <span class="badge active">🔥 진행중</span>
        <div class="title">9월 회식 메뉴 및 장소 선정</div>
        <div class="date">마감: 9월 25일(금)</div>
    </a>

    <!-- 투표 2 -->
    <a href="notice2.html" class="card">
        <span class="badge active">🔥 진행중</span>
        <div class="title">다음 주 풋살 일정 참여 조사</div>
        <div class="date">마감: 9월 28일(월)</div>
    </a>

    <!-- 마감된 공지 -->
    <a href="#" class="card" style="opacity: 0.6;">
        <span class="badge closed">완료</span>
        <div class="title">8월 활동 정산 안내</div>
        <div class="date">2026.08.31 종료</div>
    </a>
</div>
</body>
</html>
